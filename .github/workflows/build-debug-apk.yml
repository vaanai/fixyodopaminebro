name: Build Quiet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          for bin in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" \
            "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" \
            "$ANDROID_SDK_ROOT/cmdline-tools/12.0/bin"; do
            if [ -x "$bin/sdkmanager" ]; then
              echo "$bin" >> "$GITHUB_PATH"
              break
            fi
          done
          if ! command -v sdkmanager >/dev/null; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            ls -la "$ANDROID_SDK_ROOT" || true
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          yes | sdkmanager --licenses
          sdkmanager \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Quiet artifact (zip contains app-debug.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Quiet
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
