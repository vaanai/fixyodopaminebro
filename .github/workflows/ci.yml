name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk quiet-debug.apk

      # The Play Store build: shrunk with R8, and signed with the upload key when the repo has it
      # (secrets described in docs/releasing.md). Without the key this still proves the release build works.
      - name: Build release bundle
        env:
          QUIET_UPLOAD_KEYSTORE_B64: ${{ secrets.QUIET_UPLOAD_KEYSTORE_B64 }}
          QUIET_UPLOAD_STORE_PASSWORD: ${{ secrets.QUIET_UPLOAD_STORE_PASSWORD }}
          QUIET_UPLOAD_KEY_ALIAS: ${{ secrets.QUIET_UPLOAD_KEY_ALIAS }}
          QUIET_UPLOAD_KEY_PASSWORD: ${{ secrets.QUIET_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$QUIET_UPLOAD_KEYSTORE_B64" ]; then
            echo "$QUIET_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export QUIET_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
            echo "SIGNED_BUNDLE=1" >> "$GITHUB_ENV"
          fi
          ./gradlew :app:bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.SIGNED_BUNDLE == '1'
        with:
          name: quiet-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-debug-apk
          path: quiet-debug.apk
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest quiet-debug.apk --prerelease --title "Quiet (latest main)" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install with: adb install -r quiet-debug.apk"

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
